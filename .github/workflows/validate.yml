name: Validate static application

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/file-storage.js
          node --check js/i18n.js
          node --check js/storage.js
          node --check tools/build-catalog.mjs
          node --check tools/server.mjs

      - name: Validate starter inventory
        run: |
          node -e "const data=require('./data/bricks.json'); if(data.schemaVersion!==1||!Array.isArray(data.items)) process.exit(1)"
