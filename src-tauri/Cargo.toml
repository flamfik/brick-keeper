[package]
name = "brick-keeper"
version = "1.0.0-beta"
description = "Standalone LEGO brick collection organizer"
authors = ["Brick Keeper contributors"]
edition = "2021"

[lib]
name = "brick_keeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
csv = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
